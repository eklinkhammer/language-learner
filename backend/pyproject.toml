[project]
name = "language-learner-backend"
version = "0.1.0"
description = "Local-first language learning backend with pronunciation correction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "mlx-whisper>=0.4",
    "transformers>=4.46",
    "torch>=2.5",
    "epitran>=1.25",
    "panphon>=0.21",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
